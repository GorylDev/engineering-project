name: olfunara

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Uruchom pnpm env:setup}
      POSTGRES_DB: ${POSTGRES_DB:?Uruchom pnpm env:setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Uruchom pnpm env:setup}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  postgres-test:
    image: postgres:18.6-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?Uruchom pnpm env:setup}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?Uruchom pnpm env:setup}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Uruchom pnpm env:setup}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  postgres_test_data:
